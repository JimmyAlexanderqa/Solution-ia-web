*{box-sizing:border-box;margin:0;padding:0}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;border-radius:12px;background:linear-gradient(145deg,#F0D08C,#C9A24E 60%,#E6C07A);color:#08111b;font-family:system-ui,sans-serif;font-weight:800;font-size:16px;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn svg{width:22px;height:22px;flex-shrink:0}
.order .btn{margin-top:18px}
.bar{transition:opacity .25s,transform .25s;position:fixed;left:0;right:0;bottom:0;padding:12px 12px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(rgba(8,17,27,0),#08111b 40%)}
.bar .btn{max-width:596px;margin:0 auto;box-shadow:0 4px 18px rgba(0,0,0,.5)}
.bar.off{opacity:0;transform:translateY(20px);pointer-events:none}
.bar small{font-weight:600;opacity:.75}
footer{margin-top:6px;text-align:center;font-family:system-ui,sans-serif;font-size:12px;color:#8E97A3}
